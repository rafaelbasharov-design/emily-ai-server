services:
  - type: web
    name: emily-ai-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: EMILY_APP_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
